<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sniper Scalper — App UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: #000; }
  body { display: flex; justify-content: center; padding: 0; font-family: var(--font-sans); }
  #root { width: 412px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { BottomNav } = window.SniperScalperDesignSystem_1bcd68;

function App() {
  const [nav, setNav] = React.useState('academy');
  const [courseOpen, setCourseOpen] = React.useState(false);
  const [splashDone, setSplashDone] = React.useState(false);
  React.useEffect(() => { const t = setTimeout(() => setSplashDone(true), 2200); return () => clearTimeout(t); }, []);

  let screen;
  if (!splashDone) screen = <SplashScreen />;
  else if (nav === 'academy' && courseOpen) screen = <CourseDetailScreen onBack={() => setCourseOpen(false)} onEnroll={() => {}} />;
  else if (nav === 'academy') screen = <AcademyScreen onOpenCourse={() => setCourseOpen(true)} />;
  else if (nav === 'news') screen = <NewsScreen />;
  else if (nav === 'settings') screen = <SettingsScreen />;
  else if (nav === 'charts') screen = <ChartsPlaceholder />;
  else screen = <AcademyScreen onOpenCourse={() => { setNav('academy'); setCourseOpen(true); }} />;

  return (
    <div style={{ height: '100vh', maxHeight: 917, display: 'flex', flexDirection: 'column', background: 'var(--bg-1)', overflow: 'hidden' }}>
      {splashDone && <StatusBar />}
      <div style={{ flex: 1, overflowY: 'auto' }} onClick={!splashDone ? () => setSplashDone(true) : undefined}>{screen}</div>
      {splashDone && <BottomNav active={nav} onSelect={(id) => { setNav(id); setCourseOpen(false); }} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
