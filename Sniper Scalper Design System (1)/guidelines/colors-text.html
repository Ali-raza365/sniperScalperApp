<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-1);font-family:var(--font-sans);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:20px 28px;box-sizing:border-box;height:150px}
.row{display:flex;align-items:baseline;gap:16px}
.row code{color:var(--text-muted);font-size:11px;margin-left:auto}</style></head>
<body>
<div class="row"><span style="color:var(--text-primary);font-size:19px;font-weight:500">Heading text — off-white</span><code>--text-primary #eceae7</code></div>
<div class="row"><span style="color:var(--text-secondary);font-size:16px">Body text — warm tan</span><code>--text-secondary #c9b8a4</code></div>
<div class="row"><span style="color:var(--text-muted);font-size:14px">Muted / captions</span><code>--text-muted #8a8078</code></div>
</body></html>
