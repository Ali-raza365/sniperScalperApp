<!-- @dsCard group="Colors" viewport="700x150" name="Market & Semantic" subtitle="Teal/red are price data only — never decorative" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-1);font-family:var(--font-sans);display:flex;gap:12px;padding:20px;box-sizing:border-box;height:150px}
.sw{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:11px;color:#fff}
.sw code{opacity:.8;font-size:10px}</style></head>
<body>
<div class="sw" style="background:var(--up)">--up gain<br><code>#26a69a</code></div>
<div class="sw" style="background:var(--down)">--down loss<br><code>#ef5350</code></div>
<div class="sw" style="background:var(--info-blue)">--info-blue level<br><code>#1a6ce0</code></div>
<div class="sw" style="background:var(--rsi-purple)">--rsi-purple<br><code>#9c27b0</code></div>
<div class="sw" style="background:var(--bg-3);color:var(--info-blue-soft)">--info-blue-soft<br><code>#aecbfa</code></div>
</body></html>
