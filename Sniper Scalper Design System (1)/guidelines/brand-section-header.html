<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-1);font-family:var(--font-sans);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:20px 28px;box-sizing:border-box;height:160px}
.sh{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.2em;font-size:14px}
.bar{width:4px;height:20px;border-radius:2px}</style></head>
<body>
<div class="sh" style="color:var(--text-primary);font-size:20px"><span class="bar" style="background:var(--accent-peach)"></span>THE PROTOCOL</div>
<div class="sh" style="color:#aecbfa"><span class="bar" style="background:#aecbfa"></span>NOTIFICATION PREFERENCES</div>
<div class="sh" style="color:var(--text-secondary)"><span class="bar" style="background:var(--accent-peach)"></span>INFORMATION</div>
</body></html>
