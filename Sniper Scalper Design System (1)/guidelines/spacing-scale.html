<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base — 20px page margins" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-1);font-family:var(--font-sans);display:flex;align-items:flex-end;gap:18px;padding:20px 28px;box-sizing:border-box;height:150px}
.s{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-muted);font-size:11px}
.bar{width:26px;background:var(--accent-peach);border-radius:4px}</style></head>
<body>
<div class="s"><div class="bar" style="height:4px"></div>4</div>
<div class="s"><div class="bar" style="height:8px"></div>8</div>
<div class="s"><div class="bar" style="height:12px"></div>12</div>
<div class="s"><div class="bar" style="height:16px"></div>16</div>
<div class="s"><div class="bar" style="height:24px"></div>24</div>
<div class="s"><div class="bar" style="height:32px"></div>32</div>
<div class="s"><div class="bar" style="height:48px"></div>48</div>
<div class="s"><div class="bar" style="height:64px"></div>64</div>
<div class="s" style="margin-left:auto"><div class="bar" style="height:20px;background:var(--accent-orange)"></div>page 20</div>
</body></html>
