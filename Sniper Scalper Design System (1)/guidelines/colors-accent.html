<!-- @dsCard group="Colors" viewport="700x150" name="Accent Ramp" subtitle="Signature peach–orange, the only decorative color" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-1);font-family:var(--font-sans);display:flex;gap:12px;padding:20px;box-sizing:border-box;height:150px}
.sw{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font-size:11px;letter-spacing:.05em}
.sw code{opacity:.8;font-size:10px}</style></head>
<body>
<div class="sw" style="background:var(--accent-peach);color:var(--text-on-accent)">--accent-peach<br><code>#f6b17a</code></div>
<div class="sw" style="background:var(--accent-orange);color:#1c1207">--accent-orange<br><code>#f5820d</code></div>
<div class="sw" style="background:var(--accent-peach-dim);color:#1c1207">--accent-peach-dim<br><code>#c8935f</code></div>
</body></html>
