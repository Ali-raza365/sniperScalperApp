<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Warm near-black elevation steps — lighter = higher" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-0);font-family:var(--font-sans);display:flex;gap:12px;padding:20px;box-sizing:border-box;height:150px}
.sw{flex:1;border-radius:12px;border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--text-secondary);font-size:11px}
.sw code{opacity:.7;font-size:10px}</style></head>
<body>
<div class="sw" style="background:var(--bg-0)">--bg-0<br><code>#000000</code></div>
<div class="sw" style="background:var(--bg-1)">--bg-1 app<br><code>#121212</code></div>
<div class="sw" style="background:var(--bg-2)">--bg-2 card<br><code>#1c1a18</code></div>
<div class="sw" style="background:var(--bg-3)">--bg-3 nested<br><code>#262320</code></div>
<div class="sw" style="background:var(--bg-chart)">--bg-chart<br><code>#0d0d0d</code></div>
</body></html>
